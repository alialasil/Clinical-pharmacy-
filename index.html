<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriRx</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
padding:0;
}

header{
background:#0b7d74;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-top:20px;
}

input{
width:70%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
}

button{
padding:12px 20px;
border:none;
background:#0b7d74;
color:white;
border-radius:10px;
cursor:pointer;
}

#result{
margin-top:20px;
}
</style>

</head>
<body>

<header>
<h1>NutriRx</h1>
<p>Drug & Food Interaction Platform</p>
</header>

<div class="container">

<div class="card">

<h2>Choose Mode</h2>

<label>
<input type="radio" name="mode" value="patient" checked>
Patient / مريض
</label>

<br><br>

<label>
<input type="radio" name="mode" value="professional">
Healthcare Professional
</label>

</div>

<div class="card">

<h2>Drug Search</h2>

<input type="text" id="drugInput" placeholder="Enter Drug Name">

<button onclick="searchDrug()">
Search
</button>

<div id="result"></div>

</div>

</div>

<script>

const drugs = [

{
name:"Panadol",
active:"Paracetamol",

patient_ar:"يمكن تناول الدواء مع الطعام أو بدونه",

warning_ar:"لا تتجاوز الجرعة الموصوفة",

professional_en:"Can be taken with or without food",

pregnancy:"Generally safe",

lactation:"Compatible",

notes:"Do not exceed 4 g/day"
},

{
name:"Concor",
active:"Bisoprolol",

patient_ar:"يمكن تناوله مع الطعام أو بدونه",

warning_ar:"لا توقف الدواء فجأة",

professional_en:"Can be taken with or without food",

pregnancy:"Use only if prescribed",

lactation:"Consult physician",

notes:"Monitor heart rate"
}

];

function searchDrug(){

let drugName =
document.getElementById("drugInput").value.trim();

let result =
document.getElementById("result");

let mode =
document.querySelector('input[name="mode"]:checked').value;

let found =
drugs.find(
d => d.name.toLowerCase() === drugName.toLowerCase()
);

if(!found){

result.innerHTML=
"<h3>Drug Not Found</h3>";

return;

}

if(mode==="patient"){

result.innerHTML = `

<div class="card">

<h2>${found.name}</h2>

<p>${found.patient_ar}</p>

<p>⚠ ${found.warning_ar}</p>

</div>

`;

}else{

result.innerHTML = `

<div class="card">

<h2>${found.name}</h2>

<p><b>Active Ingredient:</b> ${found.active}</p>

<p><b>Food Advice:</b> ${found.professional_en}</p>

<p><b>Pregnancy:</b> ${found.pregnancy}</p>

<p><b>Lactation:</b> ${found.lactation}</p>

<p><b>Notes:</b> ${found.notes}</p>

</div>

`;

}

}

</script>

</body>
</html>
